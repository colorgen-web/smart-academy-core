<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#2B3FD6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1A6B" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- clipboard / roster card -->
  <g filter="url(#sh)">
    <rect x="132" y="196" width="248" height="252" rx="34" fill="url(#card)"/>
  </g>
  <!-- checklist rows -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <circle cx="186" cy="298" r="17" fill="#22C55E"/>
    <path d="M178 298l6 6 11-12" stroke="#fff" stroke-width="6" fill="none"/>
    <rect x="218" y="290" width="122" height="16" rx="8" fill="#C7D2FE"/>
    <circle cx="186" cy="354" r="17" fill="#22C55E"/>
    <path d="M178 354l6 6 11-12" stroke="#fff" stroke-width="6" fill="none"/>
    <rect x="218" y="346" width="96" height="16" rx="8" fill="#C7D2FE"/>
    <circle cx="186" cy="410" r="17" fill="none" stroke="#A5B4FC" stroke-width="6"/>
    <rect x="218" y="402" width="110" height="16" rx="8" fill="#E0E7FF"/>
  </g>
  <!-- graduation cap -->
  <g filter="url(#sh)">
    <path d="M256 56 L410 122 L256 188 L102 122 Z" fill="#FFC83D"/>
    <path d="M176 154 v38 c0 22 36 40 80 40 s80-18 80-40 v-42 l-80 34 z" fill="#F59E0B"/>
    <path d="M256 56 L410 122 L256 188 L102 122 Z" fill="#FFD25E"/>
    <path d="M384 133 v58" stroke="#FFC83D" stroke-width="8" stroke-linecap="round"/>
    <circle cx="384" cy="198" r="12" fill="#FFC83D"/>
  </g>
</svg>
