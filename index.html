<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9fafd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090e19" media="(prefers-color-scheme: dark)" />
    <title>Smart Academy</title>
    <script>
      // 첫 화면이 그려지기 전에 테마를 적용해 깜빡임을 막는다 (src/hooks/useTheme.ts 와 같은 키/규칙)
      try {
        var t = localStorage.getItem('academy_theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
